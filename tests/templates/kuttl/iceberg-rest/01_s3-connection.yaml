---
apiVersion: s3.stackable.tech/v1alpha1
kind: S3Connection
metadata:
  name: garage
spec:
  host: "garage.${NAMESPACE}.svc.cluster.local"
  port: 9000
  # The operators pass this on to the products (Trino: s3.region, Hive:
  # fs.s3a.endpoint.region), so it has to match s3_region in 20_garage.yaml.
  # The default (us-east-1) is not used, to keep the region the same everywhere:
  # the Hadoop S3 implementation falls back to us-east-2 rather than us-east-1
  # when unset, and Garage rejects requests signed for a different region.
  region:
    name: region-1
  accessStyle: Path
  credentials:
    secretClass: s3-credentials-class
  tls:
    verification:
      server:
        caCert:
          secretClass: tls
---
apiVersion: secrets.stackable.tech/v1alpha1
kind: SecretClass
metadata:
  name: s3-credentials-class
spec:
  backend:
    k8sSearch:
      searchNamespace:
        pod: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  labels:
    secrets.stackable.tech/class: s3-credentials-class
stringData:
  # Garage requires the GK<24 hex> key id format and a 64 hex char secret.
  # Must match the GARAGE_DEFAULT_* variables in 20_garage.yaml.
  accessKey: GK31c0ffee31c0ffee31c0ffee
  secretKey: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
