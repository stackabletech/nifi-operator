---
# The recreated StatefulSet must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the NifiCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available nificlusters.nifi.stackable.tech/test-nifi --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-nifi-node-default
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
status:
  readyReplicas: 2
  replicas: 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-nifi-serviceaccount
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-nifi-rolebinding
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-nifi-node
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: test-nifi-node
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-nifi-node-default
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
---
apiVersion: v1
kind: Service
metadata:
  name: test-nifi-node-default-headless
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
---
apiVersion: v1
kind: Service
metadata:
  name: test-nifi-node-default-metrics
  ownerReferences:
    - apiVersion: nifi.stackable.tech/v1alpha1
      controller: true
      kind: NifiCluster
      name: test-nifi
